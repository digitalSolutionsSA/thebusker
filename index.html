<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0a07" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>The Busker — Music Hall & Venue</title>
    <meta name="description" content="The Busker Music Hall & Venue — live music, great food and Bok Town rugby screenings in Vereeniging. Book your tickets online." />
    <meta property="og:title" content="The Busker — Music Hall & Venue" />
    <meta property="og:description" content="Live music, great food and Bok Town rugby screenings. Book your tickets online." />
    <meta property="og:image" content="/brand/logo-white.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a fallback, then swaps) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Manrope:wght@300..800&family=Satisfy&family=Permanent+Marker&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Manrope:wght@300..800&family=Satisfy&family=Permanent+Marker&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/brand/logo-white.webp" type="image/webp" />
    <!-- Show data comes from Supabase: open that connection while the app code downloads -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Home page: start the hero photo (the largest thing on screen) in parallel with the JS -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/images/hero/busker-bar.webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
